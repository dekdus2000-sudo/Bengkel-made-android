name: Build Bengkel Made APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source
        run: unzip -q Bengkel-Made-Android-v1.3.1-source.zip -d android-src
      - name: Build signed debug APK
        working-directory: android-src
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bengkel-Made-v1.3.1-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
